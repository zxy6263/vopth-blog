# ===========================================================================
#  Hexo 主配置  —  vopth.xyz
#  说明：本文件只放「站点级」设置；主题外观相关全部在 _config.butterfly.yml
# ===========================================================================

# ------------------------------------------------------------------ 站点信息
# 站名用小写 v（站主要求）—— 这里改了，导航栏、banner、浏览器标题、
# 侧边栏作者卡、RSS/sitemap 里的站名会一起跟着变。
title: vopth
subtitle: '写代码，也写生活'
description: 'vopth 的个人主页与技术博客 —— 记录编程、折腾与日常。'
keywords: 'vopth,个人博客,技术博客,编程笔记'
author: vopth
language: zh-CN
timezone: 'Asia/Shanghai'

# ------------------------------------------------------------------ 网址设置
# url 必须写成你的正式域名，Cloudflare Pages 需要在 Travis/构建时保持绝对路径正确
url: https://vopth.xyz
# 若部署在子目录（如 https://example.com/blog）才需要改，根域名保持 /
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # 去掉 URL 末尾的 index.html
  trailing_html: false # 去掉 URL 末尾的 .html

# ------------------------------------------------------------------ 目录结构
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ------------------------------------------------------------------ 写作
new_post_name: :title.md # 新文章文件名
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true # 每篇文章一个同名资源文件夹，方便放图片
relative_link: false
future: true
# 文章里用 [toc] / <!-- more --> 控制摘要，Butterfly 主题会自动生成目录

# ------------------------------------------------------------------ 分类 & 标签
default_category: uncategorized
category_map:
tag_map:

# ------------------------------------------------------------------ 元数据
meta_generator: true

# ------------------------------------------------------------------ 日期 / 时间
#
# ★ date_format 决定【显示】格式，改这一行就等于改全站。
#   主题模板里写的是 date(page.date, config.date_format)，以下三处都走它：
#     · includes/header/post-info.pug     文章页的「发表于 / 更新于」
#     · includes/mixins/indexPostUI.pug   首页的文章卡片
#     · includes/mixins/article-sort.pug  归档页
#   所以要「精确到秒」只能改这里，改完这三处会一起带上时分秒。
#
#   time_format 是 Hexo 内部做日期分组用的，这个主题不显示它。
#
# ⚠️ 已知取舍：文章的 front-matter 里 date 目前只精确到【分钟】
#    （例如 2026-10-05 05:22:00），所以秒数一律显示 :00。
#    要让秒数有真实意义，得把每篇文章的秒补齐 —— 可以从 git 提交时间取。
date_format: YYYY-MM-DD HH:mm:ss
time_format: HH:mm:ss
# 「最后更新」时间的兜底值：用文章 front-matter 里的 date。
#
# ⚠️ 千万不要改成 'mtime'。mtime 取的是【文件系统修改时间】，而 Cloudflare
#    每次构建都是全新 checkout，文件 mtime 等于构建那一刻 —— 结果是所有文章
#    都显示「更新于 = 构建当天」，而且越往后越离谱
#    （11 月发一篇新文章，10 月的旧文也会变成"更新于 11 月"）。
#
# 想手动标注某篇文章的修订日期，在它的 front-matter 里写 updated: 即可。
updated_option: 'date'

# ------------------------------------------------------------------ 分页
per_page: 10
pagination_dir: page

# ------------------------------------------------------------------ 语法高亮
# Butterfly 主题自带代码高亮（highlight.js / prismjs），
# 所以这里把 Hexo 自带的两个高亮器都关掉，避免双重包裹。
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# ------------------------------------------------------------------ 搜索
# 供 Butterfly 的本地搜索（local_search）生成 search.xml
search:
  path: search.xml
  field: post
  content: true
  format: html

# ------------------------------------------------------------------ 站点地图
# 供搜索引擎抓取，加快新文章的收录速度
# 生成地址：https://vopth.xyz/sitemap.xml
sitemap:
  path: sitemap.xml
  # 注意：rel 保持 false 是刻意的。
  # hexo-generator-sitemap 的 rel: true 靠正则 /<head>(?!<\/head>).+?<\/head>/
  # 注入 <link rel="sitemap">，但该正则没有 s 标志、跨不了换行，
  # 在带换行的 HTML 上会静默失效。改为在 _config.butterfly.yml 的
  # inject.head 里手动注入，效果一样且可靠。
  rel: false
  tags: false # 标签页/分类页属于内容较薄的聚合页，不放进 sitemap
  categories: false

# ------------------------------------------------------------------ 主题
theme: butterfly

# ------------------------------------------------------------------ 部署（备用方案）
# 主推方案是 Cloudflare Pages 直接连 GitHub 仓库，无需 deploy 配置。
# 如果你想用 hexo deploy 推送到 Cloudflare，取消下面注释并 npm i hexo-deployer-git
# deploy:
#   type: git
#   repo: git@github.com:你的用户名/vopth-blog.git
#   branch: main
