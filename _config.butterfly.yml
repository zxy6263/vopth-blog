# ===========================================================================
#  Butterfly 主题配置（覆盖式）
# ---------------------------------------------------------------------------
#  这里只写「要覆盖的项」，没写的自动沿用主题默认值。
#  原理：Hexo 会把本文件与主题自带配置做深合并（deepMerge），本文件优先。
#  主题完整默认值在：node_modules/hexo-theme-butterfly/_config.yml
#  Butterfly 官方文档：https://butterfly.js.org/
# ===========================================================================

# ------------------------------------------------------------------ 导航栏
nav:
  logo: /img/logo.svg
  display_title: true
  display_post_title: true # 进文章页时导航栏显示文章标题
  fixed: true # 滚动时导航栏固定在顶部

# 导航菜单：  显示名: 路径 || 图标
menu:
  首页: / || fas fa-home
  关于: /about/ || fas fa-user
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  友链: /link/ || fas fa-link

# ------------------------------------------------------------------ 左侧社交按钮
social:
  fab fa-github: https://github.com/zxy6263 || Github || '#24292e'
  fas fa-envelope: mailto:3585648116@qq.com || Email || '#4a7dbe'
  # 指向「订阅本站」页面，而不是直接指向 /atom.xml。
  # /atom.xml 本身保持原始 XML 不变 —— RSS 阅读器需要拿到它，
  # 若在 /atom.xml 上做跳转或美化页，所有阅读器都会失效。
  fas fa-rss: /subscribe/ || RSS 订阅 || '#f26522'

# ------------------------------------------------------------------ 站点图标 / 头像
favicon: /img/favicon.svg

avatar:
  img: /img/avatar.jpg # 换成别的头像：把图放到 source/img/ 再改这一行
  effect: true # 鼠标悬停转一圈

# ------------------------------------------------------------------ 顶部大图（首页 banner）
disable_top_img: false
default_top_img: /img/banner-page.svg # 其他页面的默认顶部图
index_img: /img/hero.jpg # 首页顶部图（1920×1186 横向大图）
# banner-home.svg 仍然保留：它现在是 404 页面的背景图（见下方 error_404）
# ---- 归档 / 分类 / 标签页 banner ----
# 这三项填的都是【海报图】。真正的视频由 source/js/banner-video.js 注入，
# 而且是从视频池里【随机】挑一个 —— 每次打开页面都可能不一样。
#
# 海报图负责另外两种情况：
#   1. JS 未执行 / 加载失败
#   2. 用户系统开了「减少动态效果」（prefers-reduced-motion）
#
# ⚠️ 不要改上面的 default_top_img —— 文章页会用它，
#    那里是干净的渐变图，不是视频。
archive_img: /videos/banner-1-poster.jpg
tag_img: /videos/banner-1-poster.jpg
category_img: /videos/banner-1-poster.jpg
footer_img: false # 页脚不加背景图，保持干净

# 文章封面
# 现在所有文章统一用这张（从壁纸视频里截的一帧）。
#
# 以后想给某篇文章单独换封面，两种方式：
#   1. 把图放进 source/img/covers/，文件名和文章文件名一样 -> 自动生效
#      （见 scripts/post-cover.js，优先级高于这里的默认值）
#   2. 在该文章 front-matter 写 cover: /img/xxx.jpg
#
# 注意：cover-1/2/3.svg 不要删 —— 友链页还在用它们当好友头像。
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/covers/default.jpg

# 图片加载失败时的兜底图（指向本地文件，避免额外 404）
error_img:
  flink: /img/avatar.svg
  post_page: /img/banner-page.svg

# 404 页面（Cloudflare Pages 会自动使用构建出的 404.html）
error_404:
  enable: true
  subtitle: '这个页面走丢了'
  background: /img/banner-home.svg

# ------------------------------------------------------------------ 首页内容
# 首页副标题打字机效果
subtitle:
  enable: true
  effect: true
  source: false # 不调用第三方一言 API，避免外链
  sub:
    - 'TOKEN爱好者'
    - '写代码，也写生活'
    - '把踩过的坑都记下来'

# 首页文章布局：3 = 封面与信息左右交替（观感最活泼）
index_layout: 3

# 首页文章摘要：2 = 有 description 用 description，否则自动截取
index_post_content:
  method: 2
  length: 200

# ------------------------------------------------------------------ 文章页
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/zxy6263
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

related_post:
  enable: true
  limit: 6
  date_type: created

# 1 = 下一篇指向更旧的文章
post_pagination: 1

# 文章超过一年未更新时提示
noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: '本文最后更新于'
  message_next: '天前，内容可能已经过时，如有错误欢迎指正。'

# 文章底部的「在 GitHub 上编辑此页」
#
# ⚠️ url 必须以 source/ 结尾：主题拼出来的是 url + page.source，
#    而 page.source 形如 _posts/blog-build-notes.md。
#
# ⚠️ 主题其实把这个链接渲染在【文章头部】的 post-info 里（见
#    includes/header/post-info.pug），和「发表于 / 更新于」挤在一起。
#    站主要的是文章【底部】，所以由 source/js/post-edit.js 把它挪下去、
#    换个措辞再显示。配置这里只负责让主题把带正确路径的 <a> 渲染出来 ——
#    那个路径（source/_posts/xxx.md）是构建时才知道的，前端拼不出来。
post_edit:
  enable: true
  url: https://github.com/zxy6263/vopth-blog/edit/main/source/

# ------------------------------------------------------------------ 页脚
footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true
  # 页脚最下面那行是免责声明。
  # 站点用了网络上的封面图和视频素材，把「来源」和「怎么找我删」写出来，
  # 比什么都不写稳妥；「联系」做成可点的邮箱，别让人还得自己去找地址。
  custom_text: '由 <a href="https://hexo.io" target="_blank" rel="noopener">Hexo</a> 驱动 · 托管于 <a href="https://workers.cloudflare.com/" target="_blank" rel="noopener">Cloudflare Workers</a><br><span class="footer-disclaimer">封面壁纸均来源于网络，侵权请<a href="mailto:3585648116@qq.com">联系</a>删除</span>'

# ------------------------------------------------------------------ 侧边栏
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true

  # 作者卡片
  card_author:
    enable: true
    description: deepseek忠实合作伙伴
    button:
      enable: true
      icon: fab fa-github
      text: 关注我
      link: https://github.com/zxy6263

  # 公告卡
  card_announcement:
    enable: true
    content: '这里记录我的技术笔记和折腾日常。<br>欢迎通过 <a href="mailto:3585648116@qq.com">邮件</a> 或 <a href="https://github.com/zxy6263" target="_blank" rel="noopener">GitHub</a> 找我聊天。'

  card_recent_post:
    enable: true
    limit: 5
    sort: date

  card_newest_comments:
    enable: false # 没接评论系统，关掉

  card_categories:
    enable: true
    limit: 8
    expand: none

  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1

  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8

  card_post_series:
    enable: true

  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    # 站点「运行时长」的起算时间
    #
    # 取值规则（重要）：主题用 Math.floor((访问者当前时间 - 起算时间) / 86400000)
    # 来计算天数，算出来是「向下取整」。所以如果起算时间设在「距离现在只有几个小时」
    # 的位置，任何一点时钟偏差都会让结果为负数，页面上就会出现「-1 天」。
    #
    # 因此这里特意留出一天以上的安全余量，取【域名注册日】作为起算点。
    # 想改成别的日期（比如正式发布日）也可以，但务必让它比"现在"早至少一整天。
    runtime_date: 2026/10/02 00:00:00

# ------------------------------------------------------------------ 右下角按钮
readmode: true # 阅读模式
darkmode:
  enable: true
  button: true
  autoChangeMode: false # 不跟随系统，手动切换
rightside_scroll_percent: true # 滚动进度显示在回到顶部按钮上

# ------------------------------------------------------------------ 全局细节
anchor:
  auto_update: true # 滚动时地址栏跟随标题变化，方便分享具体小节
  click_to_scroll: true

photofigcaption: true

copy:
  enable: true
  copyright:
    enable: true # 复制正文时自动附上出处
    limit_count: 150

# 字数统计（依赖 hexo-wordcount，已安装）
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 不蒜子访问统计：官方服务近年不稳定，默认全关。
# 想要页脚显示 PV/UV，把下面三个改成 true 即可（会引入一次第三方请求）。
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# ------------------------------------------------------------------ 搜索
search:
  use: local_search
  placeholder: '搜索文章…'
  local_search:
    preload: true # 站点小，直接预加载 search.xml，搜索秒开
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false

# ------------------------------------------------------------------ 分享
share:
  use: sharejs
  sharejs:
    sites: wechat,weibo,qq

# ------------------------------------------------------------------ 评论
# 留空 = 不显示评论区。要开启请看 README「可选：开启评论」，
# 用 giscus（基于 GitHub Discussions，完全免费、无需服务器）。
comments:
  # ⚠️ 必须是【列表】，且首字母大写。
  # 主题里的判断是 `use[0] === 'Giscus'` —— 写成 `use: giscus` 会静默不生效。
  use:
    - Giscus
  text: true
  lazyload: true
  count: false
  card_post_count: false

# giscus 参数：repo_id / category_id 来自 https://giscus.app/ 生成的代码
giscus:
  repo: zxy6263/vopth-blog
  repo_id: R_kgDOU5RwVw
  category_id: DIC_kwDOU5RwV84DG65J
  light_theme: light
  dark_theme: dark
  # 主题写死了 mapping=pathname 和 reactions=1，但【没设 data-lang】，
  # 不传的话界面是英文。这几项通过 option 原样透传到 giscus 的 script 标签。
  option:
    data-lang: zh-CN
    data-input-position: bottom

# ------------------------------------------------------------------ 统计
# 推荐用 Cloudflare Web Analytics：免费、无 Cookie、就在你部署的平台上
# 到 Cloudflare Dashboard → Analytics → Web Analytics 建站点，把 token 填这里
cloudflare_analytics:
# 可选：百度统计 ID
baidu_analytics:

# ------------------------------------------------------------------ 外观
# 主题色（值必须用双引号包起来）
theme_color:
  enable: true
  main: '#4A6CF7'
  paginator: '#00C4B6'
  button_hover: '#FF7242'
  text_selection: '#00C4B6'
  link_color: '#4A6CF7'
  meta_color: '#858585'
  hr_color: '#A4D8FA'
  code_foreground: '#F47466'
  code_background: 'rgba(27, 31, 35, .05)'
  toc_color: '#00C4B6'
  blockquote_padding_color: '#4A6CF7'
  blockquote_background_color: '#4A6CF7'
  scrollbar_color: '#4A6CF7'
  meta_theme_color_light: '#ffffff'
  meta_theme_color_dark: '#0d0d0d'

category_ui: index # 分类页用首页那种卡片布局
tag_ui: index
rounded_corners_ui: true
text_align_justify: false
mask:
  header: true
  footer: true

preloader:
  enable: false # 关掉全屏加载动画，首屏更快
enter_transitions: true # 页面切换淡入

display_mode: light
activate_power_mode:
  enable: false

# ------------------------------------------------------------------ 图片与提速
lightbox: medium_zoom # 点击图片放大

lazyload:
  enable: true
  native: true # 用浏览器原生 loading="lazy"，不再引第三方库
  field: site
  blur: false

instantpage: true # 鼠标悬停链接时预取，点开几乎瞬间
pjax:
  enable: false # PJAX 与第三方脚本容易冲突，保持关闭更稳

# ------------------------------------------------------------------ SEO
Open_Graph_meta:
  enable: true

structured_data:
  enable: true

# 站长平台验证（拿到验证码后取消注释）
site_verification:
  # - name: google-site-verification
  #   content: xxxxxxxx
  # - name: baidu-site-verification
  #   content: xxxxxxxx

# ------------------------------------------------------------------ 资源 CDN
# 全部走 local：字体图标、打字机、灯箱、分享按钮等都由你自己的站点提供，
# 不依赖 jsDelivr / unpkg（这两个在国内经常被墙或抽风）。
CDN:
  internal_provider: local
  third_party_provider: local
  version: true

# ------------------------------------------------------------------ 自定义注入
inject:
  head:
    - '<link rel="stylesheet" href="/css/custom.css">'
    # 手动声明站点地图。
    # 不用 hexo-generator-sitemap 的 rel: true —— 它的注入正则是
    # /<head>(?!<\/head>).+?<\/head>/，没有 s 标志、跨不了换行，
    # 在带换行的 HTML 上静默失效（上游 bug）。这里手动注入最可靠。
    - '<link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">'
  bottom:
    - '<script src="/js/profile-hero.js" defer></script>'
    - '<script src="/js/banner-video.js" defer></script>'
    # 浏览量：显示「阅读 N」和侧边栏「总访问量」。
    # 计数接口是 /api/views，由 src/index.js 那个 Worker 提供（同域，无需跨域）。
    - '<script src="/js/page-views.js" defer></script>'
    # 阅读进度条：顶部一条细线。脚本自己判断有没有正文容器，列表页不显示。
    - '<script src="/js/reading-progress.js" defer></script>'
    # 把主题渲染在文章头部的「编辑此页」链接挪到正文末尾（配套 post_edit）。
    - '<script src="/js/post-edit.js" defer></script>'
    # 搜索快捷键：Ctrl+K / Cmd+K / 直接按斜杠。
    - '<script src="/js/search-shortcut.js" defer></script>'
    # 右下角「设置」里加一个进后台的入口（往 #rightside-config-hide 里插一个 <a>）。
    # 不想用就把这一行删掉，不影响后台本身。
    - '<script src="/js/admin-entry.js" defer></script>'
