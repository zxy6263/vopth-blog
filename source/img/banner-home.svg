  <circle cx="1270" cy="180" r="420" fill="url(#violet)"/>
  <circle cx="260" cy="760" r="460" fill="url(#teal)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2">
    <circle cx="1320" cy="620" r="150"/>
    <circle cx="1320" cy="620" r="230"/>
    <circle cx="1320" cy="620" r="310"/>
  </g>
  <path d="M0 700 C 320 620, 560 800, 900 720 S 1400 640, 1600 700 L1600 900 L0 900 Z"
        fill="#0F172A" fill-opacity="0.35"/>
</svg>
